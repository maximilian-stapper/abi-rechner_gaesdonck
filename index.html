    <script>
      // Neue Version auf GitHub Pages? Dann einmal frisch laden. Die Home-Bildschirm-App hält alte Dateien
      // sonst lange fest. Version setzen: node tools/bump-version.mjs (schreibt sie hier und in version.json).
      (() => {
        const mine = document.querySelector('meta[name="app-version"]').content;
        const check = () => {
          if (!mine || location.protocol === "file:" || document.querySelector("dialog[open]")) return;
          fetch("version.json?t=" + Date.now(), { cache: "no-store" })
            .then((r) => (r.ok ? r.json() : null))
            .then((j) => {
              const v = j && j.v;
              if (!v || v === mine) return;
              try {
                if (sessionStorage.getItem("abirechner.update") === v) return; // pro Sitzung nur ein Versuch
                sessionStorage.setItem("abirechner.update", v);
              } catch (e) {}
              location.replace(location.pathname + "?v=" + encodeURIComponent(v));
            })
            .catch(() => {});
        };
        addEventListener("load", check);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") check();
        });
      })();
    </script>

    <style>
      .loader {
        --time: 2s;

        --lift: 24px;

        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 100vh;
        height: 100dvh;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: var(--bg, #161618);
        transition:
          opacity 0.25s ease,
          visibility 0.25s;
      }
      .loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader__logo {
        width: min(26vw, 110px);
        height: auto;
        overflow: visible;
        fill: #fff;
        transform: translateY(calc(var(--lift) * -1));
      }
      .loader__logo .part {
        transform-box: fill-box;
        animation-fill-mode: both;
        animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      }
      .loader__logo .bar {
        transform-origin: 50% 50%;
        animation-name: bar-in;
        animation-duration: calc(var(--time) * 0.35);
      }
      .loader__logo .stem {
        transform-origin: 50% 0;
        animation-name: stem-in;
        animation-delay: calc(var(--time) * 0.15);
        animation-duration: calc(var(--time) * 0.4);
      }
      .loader__logo .star {
        transform-origin: 50% 50%;
        animation-name: star-in;
        animation-duration: calc(var(--time) * 0.3);
        animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .loader__logo .star-top {
        animation-delay: calc(var(--time) * 0.45);
      }
      .loader__logo .star-left {
        animation-delay: calc(var(--time) * 0.55);
      }
      .loader__logo .star-right {
        animation-delay: calc(var(--time) * 0.65);
      }
      @keyframes bar-in {
        from {
          opacity: 0;
          transform: scaleX(0.1);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes stem-in {
        from {
          transform: scaleY(0);
        }
        to {
          transform: none;
        }
      }
      @keyframes star-in {
        from {
          opacity: 0;
          transform: scale(0.2) rotate(-60deg);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      html,
      body,
      dialog,
      input,
      select,
      textarea {
        color-scheme: dark;
      }
      .loader__name {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 44px);
        margin: 0;
        padding-left: 0.5em;
        text-align: center;
        font:
          600 clamp(10px, 3vw, 13px) / 1 -apple-system,
          system-ui,
          "Segoe UI",
          sans-serif;
        letter-spacing: 0.5em;
        text-transform: uppercase;
        color: #fff;
        animation: name-in calc(var(--time) * 0.3)
          cubic-bezier(0.22, 1, 0.36, 1) calc(var(--time) * 0.5) both;
      }
      @keyframes name-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .g {
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .loader__logo .part,
        .loader__name {
          animation: none;
        }
      }
    </style>

    <script>
      (() => {
        const loader = document.getElementById("loader");
        const MIN_MS =
          parseFloat(getComputedStyle(loader).getPropertyValue("--time")) *
          1000;
        const FADE_MS = 250;
        const start = performance.now();
        const hide = () => {
          // Die Kästen zoomen auf, während das Logo ausblendet (motion.js)
          if (typeof Motion !== "undefined") Motion.replay();
          loader.classList.add("is-hidden");
          setTimeout(() => loader.remove(), FADE_MS + 50);
        };
        const onReady = () =>
          setTimeout(hide, Math.max(0, MIN_MS - (performance.now() - start)));
        if (document.readyState === "complete") onReady();
        else window.addEventListener("load", onReady);
      })();
    </script>
